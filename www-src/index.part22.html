    explain:'ملخص النص بكلماتنا (النص كاملًا في كتابك ص71–72):\nيسألنا النص: كيف كانت الرسالة تنتقل قديمًا من مكان إلى آخر؟ ثم يحكي رحلتها:\n1) في البداية كانت الرسالة صغيرة تُربط بقدم حمامة زاجلة تطير فوق الجبال والصحارى وتتحدى الرياح والعواصف لتوصل الأخبار، وكان الناس ينتظرونها بشوق، وقد تستغرق أشهرًا.\n2) ثم انتقلت إلى حقيبة ساعي بريد شجاع لا يخاف الطرق الصعبة، يدق أبواب البيوت مبتسمًا، فينتظره الجميع بلهفة.\n3) ثم وصلت إلى شاشة الحاسوب، فصار البريد الإلكتروني أسرع من البرق، تصل الرسالة بضغطة زر خلال ثوانٍ إلى أي مكان في العالم، وأصبح العالم أصغر.\nويختم النص بأن رحلة الرسالة لن تتوقف، وربما نتواصل يومًا بالأفكار دون كلمات، ويسألنا: كيف تتخيل وسيلتك في المستقبل؟',

    explain:'من الكتاب (ص76):\nأقرأ (1): سلّم ساعي البريد الرسالتَيْنِ · رأى المعلم الطالبتَيْنِ في المكتبة · قابل عمر الصديقَيْنِ في الحديقة.\nأقرأ (2): كافأ المدير العاملِينَ · شكرت التلميذة المعلمِينَ في المدرسة · نصح المدرب اللاعبِينَ قبل المباراة.\nألاحظ:\n• الكلمات في المجموعة (1) مثنى، وقع عليها فعل الفاعل فهي مفعول به، وخُتمت بـ (يْنِ).\n• الكلمات في المجموعة (2) جمع مذكر سالم، وقع عليها فعل الفاعل فهي مفعول به، وخُتمت بـ (ينَ).\nأستنتج:\n• علامة نصب المفعول به المثنى: الياء.\n• علامة نصب المفعول به جمع المذكر السالم: الياء.\n\nنموذج إعراب: يحب الله الشاكرين ← الشاكرين: مفعول به منصوب، وعلامة نصبه الياء لأنه جمع مذكر سالم.',
    example:{q:'استخرجي المفعول به ونوعه: رسم صديقي لوحتين جميلتين.', steps:['ما الذي رسمه صديقي؟ لوحتين ← مفعول به','لوحتين تدل على اثنتين وخُتمت بـ (يْنِ) ← مثنى'], a:'لوحتين: مفعول به مثنى منصوب بالياء'},
