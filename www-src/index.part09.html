    objectives:['أتعرف أهمية نهر النيل للمصريين','أقرأ النص قراءة جهرية صحيحة','أستخدم المفردات الجديدة في سياقات متنوعة','أستنتج الفكرة الرئيسة والفكر الفرعية للنص'],
    concepts:['«الخروج إلى النهار»: نص فرعوني قديم فيه اعترافات المصري القديم','المصريون القدماء احترموا النيل وعرفوا قيمته واحتفلوا بوفائه','المفردات: مَوْسِمه (وقت ظهوره، ج مواسم)، يبلغ (يصل)، يُطلق عليه (يُسمى)، عَقَبة (المراد: عائق/مانع، ج عقبات)، اختتم (أتمّ/أنهى، والمضاد بدأ)، يحنو على (يعطف على)، يجلب (يُحضر)، اقتصد (توسّط/اعتدل، والمضاد أسرف)'],
    explain:'من الكتاب (ص10–11) بكلماتنا:\nيبدأ النص بجمل قالها المصري القديم منذ آلاف السنين يعترف فيها بأنه حافظ على النيل: لم يلوّث ماءه، ولم يمنع الفيضان، ولم يحجز الماء الجاري، وكان يعطي الجائع خبزًا والعطشان ماءً.\n• هذه الجمل جزء من «اعترافات المصري القديم» في نص فرعوني اسمه «الخروج إلى النهار».\n• النيل يُلقّب بـ«أبي الأنهار الإفريقية».\n• تدل الاعترافات على أن المصريين القدماء احترموا النيل وعرفوا قيمته، وكانوا يرون خيره أنفع من الذهب والفضة والجواهر.\n• كانوا يحتفلون كل عام بعيد «وفاء النيل»، وما زال المصريون يحتفلون به يوم 15 أغسطس.\n• يختم النص بدعوتنا نحن أيضًا أن نحافظ على النيل: لا نلقي فيه المخلفات، ونقتصد في استخدام مائه، ونعرف حقه علينا.\n\nمن مفردات النص: يجلب: يُحضر · يحنو على: يعطف على · اقتصد ≠ أسرف · اختتم ≠ بدأ · عقبة ج عقبات.',
    example:{q:'ما اسم النص الفرعوني القديم الذي أُخذت منه الجمل؟', steps:['أبحث في النص عن كلمة «نص يُسمى»','«من نص يُسمى (الخروج إلى النهار)»','الإجابة: الخروج إلى النهار'], a:'الخروج إلى النهار'},

    objectives:['أتعرف المفعول به','أميّز الفاعل من المفعول به في الجملة الفعلية','أوظف المفعول به في جمل من إنشائي'],
    concepts:['الجملة الفعلية تتكون من الفعل والفاعل، والفاعل مرفوع','المفعول به: هو الاسم الذي يقع عليه فعل الفاعل، وهو منصوب'],
    explain:'من الكتاب (ص15):\nأولًا أقرأ: 1) شكرَ التلميذُ المعلمَ. 2) سقى الفلاحُ الأرضَ. 3) احترمَ القدماءُ نهرَ النيل.\nثانيًا ألاحظ: الجمل السابقة كلها جمل فعلية، والكلمات (المعلمَ – الأرضَ – نهرَ) هي التي وقع عليها فعل الفاعل.\nثالثًا أستنتج: المفعول به هو الاسم الذي يقع عليه فعل الفاعل.\nتذكّر: الجملة الفعلية تتكون من الفعل والفاعل، والفاعل مرفوع.\nمثال: قرأَ التلميذُ الكتابَ ← الكتابَ: مفعول به.',
    example:{q:'حدّدي المفعول به: يسبحُ السمكُ في مياهِ النيل.', steps:['الفعل: يسبح، الفاعل: السمك','هل هناك اسم وقع عليه الفعل؟ لا؛ «في مياه» جار ومجرور','إذن لا مفعول به في هذه الجملة'], a:'لا يوجد مفعول به (السمك فاعل)'},

  { id:'r5-ar-hamza', subject:'لغة عربية', unit:'الوحدة الأولى: نيلنا أمانة', title:'القواعد الإملائية: همزة القطع وألف الوصل', page:17, lang:'ar', source:'book',
    objectives:['أميّز بين همزة القطع وألف الوصل','أكتب كلمات تتضمن همزة قطع أو ألف وصل كتابة صحيحة'],
    concepts:['همزة القطع: تُكتب ألفًا فوقها أو تحتها همزة (أ، إ)، وتُنطق في بداية الكلام ووسطه، مثل: أحمد، حضر أحمدُ','ألف الوصل: تُكتب ألفًا بدون همزة (ا)، تُنطق في بداية الكلام ولا تُنطق في وسطه، مثل: استمعْ، تحدثْ واستمعْ','حيلة: ضعي «واو» قبل الكلمة؛ إذا نُطقت الهمزة فهي همزة قطع، وإذا لم تُنطق فهي ألف وصل'],
    explain:'من الكتاب (ص17):\nالمجموعة 1: أُسهمُ في الحفاظ على نهر النيل. إِغلاقُ المصابيح نهارًا يوفّر الكهرباء. لم أُلوثْ ماء النهر. ← في (أُسهم – إِغلاق – أُلوث) هناك همزة فوق الألف أو تحته، وتُنطق الهمزة دائمًا في بداية الكلام وفي وسطه.\nالمجموعة 2: استيقظتُ مبكرًا. الكتابُ الذي قرأتُه عن نهر النيل كان ممتعًا. يجب أن يحافظ المصريُّ على نظافة المياه. ← في (استيقظت – الكتاب – المصري) لا توجد همزة فوق الألف أو تحتها، وتُنطق في بداية الكلام ولا تُنطق في وسطه.\nأستنتج:\n• همزة القطع: تُكتب ألفًا فوقها أو تحتها همزة، وتُنطق في بداية الكلام وفي وسطه، مثل: (أحمد)، (حضر أحمدُ).\n• ألف الوصل: تُكتب ألفًا بدون همزة، وتُنطق في بداية الكلام ولا تُنطق في وسطه، مثل: (استمعْ)، (تحدثْ واستمعْ).\nانتبه: لتستطيعي التمييز بين همزة القطع وألف الوصل: ضعي واوًا قبل الكلمة، إذا نطقتِ الهمزة فهي همزة القطع، وإذا لم تنطقيها فهي ألف الوصل.',
    example:{q:'كلمة «استمرّ»: همزة قطع أم ألف وصل؟', steps:['أضع واوًا قبلها: وَستمرّ','لم أنطق الهمزة','إذن ألف وصل'], a:'ألف وصل'},
    questions:[
