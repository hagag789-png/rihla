  { id:'o3-ar-u2-rafa', subject:'لغة عربية', unit:'الوحدة الثانية: صفاتي الجميلة', title:'الدرس الثالث (القراءة): أول من رفع يده', page:60, lang:'ar', source:'book',

    explain:'من الكتاب (ص61–63):\nفي بداية العام الدراسي، وفي أول حصص مادة الرياضيات، شرح المعلم درسًا جديدًا، ثم قال: «من عنده الشجاعة أن يحل أول مسألة على السبورة؟».\nصمت الجميع، ونظر كل واحد منهم للآخر، بعضهم خاف أن يخطئ، والبعض خجل أن يرفع يده، لكن إيمان رفعت يدها، ابتسم المعلم وقال: «تفضلي يا إيمان».\nتوجهت إيمان إلى السبورة، وبدأت تكتب الحل خطوة خطوة، حتى أتمت الإجابة.\nقال المعلم: «رائع! حتى لو كان هناك خطأ بسيط، فالمهم أنك كنت شجاعة وحاولت».\nفرحت إيمان بكلام المعلم، وعندما رأى التلاميذ زميلتهم إيمان تشجعوا هم أيضًا، وبدأ باقي التلاميذ يرفعون أيديهم واحدًا بعد الآخر.\nوفي نهاية الحصة قال المعلم: «أحسنتم يا أبنائي ويا بناتي». ثم نظر إلى إيمان وقال: «اليوم تعلمنا مع إيمان، ليس لأنها تعرف الإجابة الصحيحة، ولكن لأنها تتصف بالشجاعة، وعندها القدرة على المحاولة».\n\nالمفردات الجديدة: مادة: جمعها مواد · صمت: سكت، والمضاد: تكلم · توجهت: ذهبت · خطوة: جمعها خطوات · أتمت: أكملت · أبناء: مفردها ابن · الشجاعة: مضادها الجبن.',
    example:{q:'لماذا صمت التلاميذ عندما سأل المعلم؟', steps:['«بعضهم خاف أن يخطئ، والبعض خجل أن يرفع يده»'], a:'خافوا من الخطأ أو خجلوا'},

    explain:'من الكتاب (ص66):\nأقرأ وألاحظ: لم يذهب محمد إلى المدرسة أمس. · لن يلعب محمد كرة القدم غدًا.\n• (لم): يأتي بعدها فعل مضارع، وتنفي حدوثه في الماضي.\n• (لن): يأتي بعدها فعل مضارع، وتنفي حدوثه في المستقبل.\n\nنشاط 1: لن تسافر الأسرة الصيف المقبل · لم يستخدم عمر الهاتف منذ ساعة · لن يزور السائح الأهرامات غدًا · لم نشاهد المباراة أمس · لم نسمع قصة الأسبوع الماضي · لن أرسم اللوحة في الإجازة القادمة.\nنشاط 2 (✓ أو ✗): لم نسافر الصيف القادم (✗) · لن نزور المكتبة بعد غد (✓) · لم أذهب إلى الحديقة الأسبوع الماضي (✓) · لن يركب أمير القارب أمس (✗) · لم تشاهد سارة التلفاز الأسبوع الماضي (✓).\nنشاط 5 (أصوّب): لن أشارك في الرحلة غدًا · لم نزر المتحف الشهر الماضي · لن يقرأ أبي الجريدة غدًا · لم تبدأ المسابقة أمس.',
