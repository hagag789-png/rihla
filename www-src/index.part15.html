    explain:'من الكتاب (ص40): يمكننا جمع الصفر كما نفعل مع أي عدد آخر. عندما نجمع الصفر مع عدد ما، يبقى العدد كما هو.\nمثال: 2 + 0 = 2 (وأيضًا 0 + 2 = 2).\n\nاستعدوا يا أصدقائي:\n(1) هيا نجمع: 5 + 0 = 5 ، 0 + 8 = 8.\n(2) أنت تضع البرتقال في السلال. وضعت 3 برتقالات في السلة الأولى، و 0 برتقالات في السلة الثانية. كم عدد البرتقالات الإجمالي؟ جملة الجمع: 3 + 0 = 3 ← الإجابة: 3 برتقالات.\n(يقول السؤال «كم عدد؟» لذا نكتب الإجابة مع كلمة «برتقالات».)\n\nوقت المحاولة (ص41): 1 + 0 ، 4 + 0 ، 6 + 1 ، 0 + 7 ، 0 + 9 ، 2 + 7. نحن نضع كرات في السلة: 0 كرة في المرة الأولى، و 5 كرات في المرة الثانية. كم عدد الكرات الإجمالي؟\nهيا نتدرب: 0 + 2 ، 0 + 6 ، 7 + 2 ، 0 + 1 ، 0 + 5 ، 4 + 4. ذهبتُ للصيد: اصطدت بالأمس 4 سمكات، واليوم 0 سمكة. كم عدد الأسماك التي اصطدتها؟',
    example:{q:'0 كرة في المرة الأولى، و 5 كرات في المرة الثانية. كم كرة؟', steps:['0 + 5','الصفر لا يغير العدد','5 كرات'], a:'5 كرات'},

    explain:'من الكتاب (ص44): عندما نأخذ 3 من 5، يتبقى عندنا 2. يمكننا كتابة ذلك هكذا:\nجملة الطرح: 5 − 3 = 2\nنقول: «خمسة ناقص ثلاثة يساوي اثنين». (−) علامة الطرح.\nالجمل مثل 3 − 2 أو 4 − 1 تُسمى الطرح.\n\nاستعدوا يا أصدقائي:\n(1) أي صورة تمثل 3 − 1؟ ← الصورة التي بها 3 طيور، طار منها 1 🐦🐦 (🐦 طار).\n(2) هيا نطرح: 4 − 3 = 1 ، 5 − 2 = 3 ، 10 − 1 = 9.\n\nوقت المحاولة (ص45): أي صورة تمثل 5 − 3؟ هيا نطرح: 2 − 1 ، 5 − 3 ، 7 − 2 ، 8 − 4 ، 10 − 2 ، 10 − 8.\nهيا نتدرب: أي صورة تمثل 6 − 4؟ هيا نطرح: 4 − 2 ، 5 − 1 ، 6 − 5 ، 9 − 7 ، 10 − 5 ، 10 − 9.',
