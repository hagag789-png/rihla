<head>

<body>
<title>رحلة المعرفة</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one app shell; children get big single-column screens, the parent gets a tabbed dashboard. */
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --surface-2:#F1EFE9; --fg:#1F2328; --muted:#5B6470; --line:#DCD8CF;
  --accent:#2F6F8F; --accent-2:#B5651D; --accent-fg:#FFFFFF; --accent-soft:#E3EEF4;
  --good:#1E7F4F; --good-soft:#DDF3E6; --warn:#9A6700; --warn-soft:#FFF1CC; --bad:#B3261E; --bad-soft:#FBE0DE; --info:#3B5BDB; --info-soft:#E2E8FF;
  --star:#E0A100; --shadow:0 2px 10px rgba(30,30,40,.08); --radius:16px;
  --font:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
  --ease:.18s ease;
}
/* child palettes (chosen by taste, not gender) */
[data-theme-kid="sunny"]{ --accent:#E0761B; --accent-2:#1F9A8A; --accent-soft:#FFE9D1; --bg:#FFF8EC; --surface-2:#FBEFD9; }
[data-theme-kid="ocean"]{ --accent:#1E63C8; --accent-2:#1F9A5A; --accent-soft:#DCE8FB; --bg:#F1F6FD; --surface-2:#E6EEF9; }
[data-theme-kid="calm"]{ --accent:#3D6B8C; --accent-2:#7A5A9E; --accent-soft:#E1EAF1; --bg:#F4F6F8; --surface-2:#EAEEF2; }
[data-theme-kid="forest"]{ --accent:#2E7D4F; --accent-2:#C96A3B; --accent-soft:#DDF0E3; --bg:#F3F8F3; --surface-2:#E7F0E8; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15181C; --surface:#1E2227; --surface-2:#262B31; --fg:#ECEEF1; --muted:#A4ACB6; --line:#363C44;
  --accent:#6FB2D6; --accent-2:#E0A15E; --accent-fg:#101316; --accent-soft:#23323B;
  --good:#5ED39A; --good-soft:#163D2A; --warn:#F2C14E; --warn-soft:#3E3215; --bad:#F28B82; --bad-soft:#4A1F1C; --info:#8FA8FF; --info-soft:#1F2748;
  --star:#F7C948; --shadow:0 2px 10px rgba(0,0,0,.4); color-scheme:dark;
}
  :root:not([data-theme="light"]) [data-theme-kid="sunny"]{ --accent:#F5A05A; --accent-2:#5BD0BF; --accent-soft:#3A2B1C; --bg:#1B1813; --surface-2:#2A241B; }
  :root:not([data-theme="light"]) [data-theme-kid="ocean"]{ --accent:#7FB0F5; --accent-2:#5DD594; --accent-soft:#1E2B40; --bg:#131922; --surface-2:#1E2633; }
  :root:not([data-theme="light"]) [data-theme-kid="calm"]{ --accent:#8DB6D1; --accent-2:#B79AD9; --accent-soft:#232E38; --bg:#161A1E; --surface-2:#22282E; }
  :root:not([data-theme="light"]) [data-theme-kid="forest"]{ --accent:#7BCB97; --accent-2:#F0A078; --accent-soft:#1F3328; --bg:#141A16; --surface-2:#1F2A22; }
}
:root[data-theme="dark"]{
  --bg:#15181C; --surface:#1E2227; --surface-2:#262B31; --fg:#ECEEF1; --muted:#A4ACB6; --line:#363C44;
  --accent:#6FB2D6; --accent-2:#E0A15E; --accent-fg:#101316; --accent-soft:#23323B;
  --good:#5ED39A; --good-soft:#163D2A; --warn:#F2C14E; --warn-soft:#3E3215; --bad:#F28B82; --bad-soft:#4A1F1C; --info:#8FA8FF; --info-soft:#1F2748;
  --star:#F7C948; --shadow:0 2px 10px rgba(0,0,0,.4); color-scheme:dark;
}
:root[data-theme="dark"] [data-theme-kid="sunny"]{ --accent:#F5A05A; --accent-2:#5BD0BF; --accent-soft:#3A2B1C; --bg:#1B1813; --surface-2:#2A241B; }
:root[data-theme="dark"] [data-theme-kid="ocean"]{ --accent:#7FB0F5; --accent-2:#5DD594; --accent-soft:#1E2B40; --bg:#131922; --surface-2:#1E2633; }
:root[data-theme="dark"] [data-theme-kid="calm"]{ --accent:#8DB6D1; --accent-2:#B79AD9; --accent-soft:#232E38; --bg:#161A1E; --surface-2:#22282E; }
:root[data-theme="dark"] [data-theme-kid="forest"]{ --accent:#7BCB97; --accent-2:#F0A078; --accent-soft:#1F3328; --bg:#141A16; --surface-2:#1F2A22; }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.7;font-variant-numeric:tabular-nums;direction:rtl}
*{box-sizing:border-box}
#app{min-height:100%;background:var(--bg);color:var(--fg);transition:background var(--ease)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap.narrow{max-width:640px}
h1,h2,h3{line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.8rem;letter-spacing:.04em;color:var(--muted);font-weight:700}
.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
.topbar{display:flex;align-items:center;gap:10px;padding-block:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.topbar .grow{flex:1;min-width:0}
.topbar h1{font-size:1.2rem}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:48px;padding:10px 18px;background:var(--surface-2);color:var(--fg);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--ease),background var(--ease);text-decoration:none}
button:hover{filter:brightness(.97)}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-accent2{background:var(--accent-2);color:var(--accent-fg)}
.btn-ghost{background:transparent;border:2px solid var(--line)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-sm{min-height:40px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn-icon{min-width:48px;padding:8px;font-size:1.4rem}
.btn-big{min-height:72px;font-size:1.25rem;border-radius:22px;width:100%}
.btn-huge{min-height:110px;font-size:1.5rem;border-radius:26px;width:100%;flex-direction:column;gap:4px}
.btn-huge .ic{font-size:2.4rem;line-height:1}
button[disabled]{opacity:.5;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid-2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card.soft{background:var(--surface-2);border-color:transparent}
.card.accent{border-color:var(--accent);background:var(--accent-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:700;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.demo{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.accent{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.tag{font-size:.78rem;color:var(--muted)}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);min-height:48px}
textarea{min-height:96px;resize:vertical}
label.f{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
.field{min-width:0}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;padding-block:6px}
.pill-tabs button{min-height:40px;padding:6px 14px;border-radius:999px;font-size:.92rem}
.pill-tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.profile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 14px;border-radius:24px;background:var(--surface);border:2px solid var(--line);cursor:pointer;min-height:170px;text-align:center}
.profile:hover{border-color:var(--accent)}
.profile .av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;background:var(--accent-soft)}
.profile .nm{font-size:1.3rem;font-weight:800}
.stars{color:var(--star);font-weight:800}
.progress{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress > span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease}
.q-visual{font-size:2.6rem;line-height:1.4;letter-spacing:.1em;text-align:center;padding:10px;word-break:break-word}
.q-prompt{font-size:1.25rem;font-weight:700}
.junior .q-prompt{font-size:1.5rem}
.junior .q-visual{font-size:3.2rem}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opt{min-height:64px;font-size:1.2rem;background:var(--surface);border:2px solid var(--line);border-radius:18px}
.junior .opt{min-height:88px;font-size:1.6rem}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.matched{border-color:var(--good);background:var(--good-soft);opacity:.75}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.order-seq{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:2px dashed var(--line);border-radius:14px;align-items:center}
.order-seq .tok{background:var(--accent-soft);border-radius:10px;padding:4px 12px;font-weight:700}
.feedback{padding:12px 14px;border-radius:14px;font-weight:600}
.feedback.good{background:var(--good-soft);color:var(--good)}
.feedback.hint{background:var(--info-soft);color:var(--info)}
.feedback.try{background:var(--warn-soft);color:var(--warn)}
.feedback.reveal{background:var(--surface-2)}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.steps .st{padding:4px 12px;border-radius:999px;background:var(--surface-2);font-size:.85rem;font-weight:700;color:var(--muted)}
.steps .st.on{background:var(--accent);color:var(--accent-fg)}
.steps .st.done{background:var(--good-soft);color:var(--good)}
.lesson-text{white-space:pre-line}
.journey{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-block:6px}
.journey .node{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none;font-size:1.1rem;border:2px solid var(--line)}
.journey .node.done{background:var(--good-soft);border-color:var(--good)}
.journey .node.now{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.journey .seg{width:18px;height:3px;background:var(--line);flex:none}
.plan{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.plan .day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:90px}
.plan .day.today{border-color:var(--accent);border-width:2px}
.plan .day h4{margin:0 0 4px;font-size:.9rem}
.task{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{width:24px;height:24px;min-height:0;margin-top:6px;flex:none}
.task .t{flex:1;min-width:0}
.task.done .t{text-decoration:line-through;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.82rem;color:var(--muted)}
.tbl{overflow-x:auto}
.kpi{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(105px,1fr))}
.kpi .k{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kpi .k b{display:block;font-size:1.4rem;line-height:1.2}
.kpi .k span{font-size:.82rem;color:var(--muted)}
.note{background:var(--surface-2);border-right:4px solid var(--accent-2);padding:10px 14px;border-radius:10px;font-size:.92rem}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pinpad button{min-height:64px;font-size:1.4rem}
.pin-dots{display:flex;gap:12px;justify-content:center;font-size:2rem;letter-spacing:.2em;min-height:48px}
.attach img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;box-shadow:var(--shadow);max-width:90vw}
.celebrate{font-size:3rem;text-align:center;line-height:1.2}
.reduce *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease}
.print-only{display:none}
@media print{
  .no-print,.topbar{display:none!important}
  .print-only{display:block}
  body{background:#fff;color:#000}
  .card{break-inside:avoid;border-color:#999}
}
@media (max-width:480px){
  body{font-size:16px}
  .match{grid-template-columns:1fr 1fr}
  .btn-huge{min-height:96px;font-size:1.3rem}
}
</style>

<div id="app" class="wrap"><p class="muted">جارٍ التحميل…</p></div>

<script>
/* =========================================================
   رحلة المعرفة — نسخة أولى قابلة للتجربة
   البيانات تُحفظ محليًا في متصفح هذا الجهاز (localStorage) فقط.
   ========================================================= */
(function(){
'use strict';
const STORAGE_KEY='rihla.v1';
const IN_ARTIFACT = /claude\.ai$/.test(location.hostname) || /claudeusercontent\.com$/.test(location.hostname) || location.hostname.includes('claude');
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad2 = n => String(n).padStart(2,'0');
function localDate(d){ d=d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function addDays(ds,n){ const d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return localDate(d); }
const DAYS_AR=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function dayName(ds){ return DAYS_AR[new Date(ds+'T12:00:00').getDay()]; }
function fmtDate(ds){ if(!ds) return '—'; const [y,m,d]=ds.split('-'); return `${d}/${m}/${y}`; }
function fmtTime(ts){ const d=new Date(ts); return `${fmtDate(localDate(d))} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function minutes(sec){ return Math.round((sec||0)/60); }
function shuffle(arr,seed){ const a=arr.slice(); let s=seed||1; for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normalizeAr(s, strict){
  s=String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  s=s.replace(/[ً-ْٰ]/g,''); // تشكيل
  s=s.replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  s=s.replace(/[،,.!؟?]/g,'');
  if(!strict){ s=s.replace(/[أإآ]/g,'ا').replace(/ى/g,'ي'); }
  return s;
}

/* ---------------- المحتوى التجريبي (موسوم بوضوح) ---------------- */
const DEMO_LESSONS = {
 nermeen:[

      {id:'q4',type:'order',skill:'ترتيب حروف كلمة',level:'تطبيق',difficulty:2,prompt:'رتّبي الحروف لتكوّني كلمة «تِين»',items:['ن','ت','ي'],answer:[1,2,0],hints:['أول صوت في تِين هو تِ'],explain:'تِين = ت ثم ي ثم ن.'}
    ]},
  { id:'n-ar-ba', subject:'لغة عربية', unit:'وحدة حيواناتي', title:'حرف الباء (ب)', lang:'ar', source:'extra',
    objectives:['أتعرف على شكل حرف الباء وصوته','أميّز الكلمات التي تبدأ بحرف الباء','أرتّب حروفًا لأكوّن كلمة قصيرة'],
    concepts:['حرف الباء','صوت الحرف في أول الكلمة'],
    explain:'هذا حرف الباء: ب\nننطقه: بَ\nكلمات تبدأ بالباء: بَطّة 🦆 ، بَيت 🏠 ، بَلّونة 🎈',
    example:{q:'كلمة «بَطّة» تبدأ بأي حرف؟', steps:['نقول الكلمة ببطء: بَ... طّة','أول صوت نسمعه هو بَ','إذن تبدأ بحرف الباء ب'], a:'ب'},
