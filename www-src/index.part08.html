  { id:'o3-ar-qissa', subject:'لغة عربية', unit:'الوحدة الأولى: العمل والأمل', title:'الكتابة: عناصر القصة المصورة', page:19, lang:'ar', source:'book',

  { id:'o3-ar-batal', subject:'لغة عربية', unit:'الوحدة الأولى: العمل والأمل', title:'قراءة: البطل الخفي', page:22, lang:'ar', source:'book',
    objectives:['أقرأ النص وأفهم أحداثه','أجيب عن أسئلة حول التفاصيل','أتعرف مفردات جديدة (ألغاز، فناء، همس، يغادر، حارس)','أستنتج معنى البطولة الحقيقية'],
    concepts:['البطل هو الشخص الذي يساعد الآخرين ويكون له دور في حياتهم','المفردات: ألغاز (مفردها لغز)، فناء (ساحة واسعة، جمعها أفنية)، يحرسنا (يحمينا)، همس (تحدث بصوت منخفض، ضدها صاح)، يغادر (يترك، ضدها يصل/يأتي)، حارس (جمعها حُرّاس/حَرَس)'],
    explain:'نص الكتاب (ص23–24):\nنحن نحب معلم اللغة العربية (الأستاذ أحمد)، وهو يحبنا كثيرًا، ودائمًا يعلمنا معلومات مفيدة من خلال ألغاز مسلية جميلة نتعلم منها معلومات مفيدة.\nفي بداية حصة اللغة العربية دخل الأستاذ أحمد مبتسمًا، وقال: «اليوم سوف أقدم لكم لغزًا، ولكنه ليس كأي لغز»، وقال: «ليس معلمًا، ولا مديرًا، لكنه بطل؛ إذا غاب نشعر بأن هناك شيئًا مهمًا ناقصًا، وبدونه لا نستطيع أن نلعب في فناء المدرسة، وهو يحرسنا، ويحرس مدرستنا، إنه من أهم الأشخاص في المدرسة، فمن هو؟».\nهمس التلاميذ.. قال المعلم: «سوف أعطيكم مساعدة.. إنه أول من يصل إلى المدرسة، وآخر من يغادرها».\nزميلنا أنس صاح: «لقد عرفته، إنه (العم أمين) حارس المدرسة الأمين».\nفكرنا جميعًا، وقلنا: «صحيح يا أنس، (العم أمين) طيب جدًا، ويخاف علينا، نراه عند دخول المدرسة في الصباح، وعند الخروج منها في نهاية اليوم الدراسي، وهو الذي ينظف فناء المدرسة، ويجعلها جميلة وآمنة.. حقًا إنه شخص مهم».\nابتسم الأستاذ أحمد، وفرح بكلامنا، وقال: «إجابتكم صحيحة، تذكروا دائمًا أن البطل هو الشخص الذي يساعد الآخرين، ويكون له دور في حياتهم».',
    example:{q:'لماذا سمّى المعلم العم أمين «بطلًا»؟', steps:['أبحث عن قول المعلم في النهاية','«البطل هو الشخص الذي يساعد الآخرين ويكون له دور في حياتهم»','العم أمين يحرس المدرسة وينظفها ويخاف على التلاميذ'], a:'لأنه يساعد الآخرين وله دور مهم في حياتهم'},
    questions:[
      {id:'q1',type:'choice',skill:'الفهم القرائي: استخراج معلومة',level:'فهم',difficulty:1,prompt:'من هو «البطل الخفي» في النص؟',options:['الأستاذ أحمد','العم أمين حارس المدرسة','مدير المدرسة'],answer:1,hints:['من عرفه أنس؟'],explain:'العم أمين حارس المدرسة الأمين.'},

      {id:'q3',type:'choice',skill:'الفهم القرائي: استخراج معلومة',level:'فهم',difficulty:2,prompt:'المساعدة التي أعطاها المعلم لحل اللغز:',options:['إنه يحمل مفاتيح المدرسة','إنه أول من يصل إلى المدرسة وآخر من يغادرها','إنه يرتدي زيًا أزرق'],answer:1,hints:['«سوف أعطيكم مساعدة..»'],explain:'أول من يصل إلى المدرسة، وآخر من يغادرها.'},
      {id:'q4',type:'match',skill:'المفردات: الترادف والتضاد',level:'فهم',difficulty:2,prompt:'صِل كل كلمة بما يناسبها',pairs:[['مضاد همس','صاح'],['مرادف يحرسنا','يحمينا'],['مفرد ألغاز','لغز'],['جمع حارس','حُرّاس']],hints:['همس = تحدث بصوت منخفض'],explain:'من المفردات الجديدة في الكتاب ص24.'},
      {id:'q5',type:'choice',skill:'استخراج الفكرة الرئيسية',level:'استنتاج',difficulty:2,prompt:'ما الفكرة الرئيسية للنص؟',options:['حل الألغاز الصعبة','البطل الحقيقي هو من يساعد الآخرين وله دور في حياتهم','يجب أن نصل مبكرًا إلى المدرسة'],answer:1,hints:['ما قاله المعلم في نهاية النص'],explain:'البطل هو الشخص الذي يساعد الآخرين ويكون له دور في حياتهم.'},

    explain:'نشيد «أسرار النجاح» (الكتاب ص35):\nالناجـحُ البطـلُ .. رفيقُـهُ الأمــلُ\nيعيشُ يومَـهُ .. كنحلـةِ العسـلِ\nلحلمِـهِ سعــى .. لم يعرفِ الكسـلْ\nيصـونُ وقتَـهُ .. ويُتقـنُ العمـلْ\nيطيـعُ ربَّـهُ .. إن قـالَ أو فعـلْ\n\nالشرح (من الكتاب): يتحدث الشاعر عن الإنسان الناجح، ويذكر لنا أسباب نجاحه، وأولها شعوره بالأمل دائمًا، ثم العمل بنشاط وبلا كسل، والمحافظة على وقته، وإتقان عمله، ثم طاعة الله في أقواله وأفعاله.\n\nالمفردات الجديدة: الناجح: المضاد الفاشل · البطل: الجمع الأبطال · رفيقه: صاحبه، والجمع رفقاء/رفاق · سعى: جدّ واجتهد · يتقن: يجيد.',
    example:{q:'بماذا شبّه الشاعر الناجح؟', steps:['أبحث عن أداة التشبيه «كـ»','«يعيش يومه كنحلة العسل»','شبّهه بنحلة العسل في نشاطها'], a:'بنحلة العسل'},

      {id:'q3',type:'match',skill:'المفردات: الترادف والتضاد',level:'فهم',difficulty:2,prompt:'صِل كل كلمة بما يناسبها',pairs:[['مرادف سعى','جدّ واجتهد'],['مرادف يتقن','يجيد'],['مضاد الناجح','الفاشل'],['جمع البطل','الأبطال']],hints:['سعى لحلمه = اجتهد'],explain:'من المفردات الجديدة ص35.'},

    objectives:['أعدّد أركان الإيمان الستة','أستنتج أهمية الإيمان في حياتي اليومية','أميّز أركان الإيمان من أركان الإسلام'],
    concepts:['أركان الإيمان: الإيمان بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، والقدر خيره وشره','الإيمان أساس تستقيم به حياة الإنسان'],
    explain:'من الكتاب (ص8): الإيمان هو أن نصدق بما جاء به النبي ﷺ من عند الله. ويقوم الإيمان على ستة أركان، تشكل الأساس الذي تستقيم به حياة الإنسان الدينية والروحية، وبدونها لا يكون الإيمان صحيحًا.\nوقد بين النبي ﷺ أركان الإيمان الستة كما ورد في حديث عمر بن الخطاب رضي الله عنه أن جبريل عليه السلام قال للنبي ﷺ: يا محمد، أخبرني عن الإيمان، فقال: «أن تؤمن بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، وتؤمن بالقدر خيره وشره» (رواه مسلم).\nفأركان الإيمان هي الركائز الأساسية التي تبنى عليها حياة المسلم بأكملها، فتمنحه القوة والثبات. وكما أن البناء القوي لا تهزه العواصف، فإن القلب المؤمن يصبح ثابتًا أمام الشدائد، مستقرًا في وجه الأزمات، مطمئنًا بأن إيمانه هو سبب السعادة في الدنيا والآخرة.\nمن ثمار الإيمان بالله تعالى: رضا الله تعالى.',
    example:{q:'هل «حج البيت» من أركان الإيمان؟', steps:['أركان الإيمان: الله، الملائكة، الكتب، الرسل، اليوم الآخر، القدر','الحج من أركان الإسلام لا الإيمان','إذن: لا'], a:'لا، الحج من أركان الإسلام'},

      {id:'q3',type:'choice',skill:'أركان الإيمان',level:'فهم',difficulty:2,prompt:'من أركان الإيمان:',options:['صوم رمضان','الزكاة','الإيمان بالقدر خيره وشره'],answer:2,hints:['الصوم والزكاة من أركان الإسلام'],explain:'الإيمان بالقدر خيره وشره.'},

  { id:'o3-is-ghashiya', subject:'تربية إسلامية', unit:'الوحدة الأولى: الثقة بالله', title:'القرآن والتفسير: سورة الغاشية (الآيات 17–26)', page:12, lang:'ar', source:'book',
    objectives:['أتلو سورة الغاشية تلاوة صحيحة','أستنتج معاني الآيات 17–26','أستنتج الدروس والقيم التي تحث عليها الآيات'],
    concepts:['الغاشية: يوم القيامة العظيم الذي يغشى الناس','الإبل: الجمال · سطحت: بسطت ومهدت · بمصيطر: بمتسلط · إلينا إيابهم: رجوعهم بعد الموت · علينا حسابهم: محاسبتهم'],
    explain:'من الكتاب (ص12–13): سورة الغاشية سورة مكية، ومعنى (الغاشية) يوم القيامة العظيم الذي يغشى الناس؛ أي يعمهم، وقد ورد هذا الوصف في آية من آيات السورة فسميت السورة بهذا الاسم.\n\nالآيات 17–26 (للتفسير):\n﴿أَفَلَا يَنظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ ﴿17﴾ وَإِلَى السَّمَاءِ كَيْفَ رُفِعَتْ ﴿18﴾ وَإِلَى الْجِبَالِ كَيْفَ نُصِبَتْ ﴿19﴾ وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ ﴿20﴾ فَذَكِّرْ إِنَّمَا أَنتَ مُذَكِّرٌ ﴿21﴾ لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ ﴿22﴾ إِلَّا مَن تَوَلَّىٰ وَكَفَرَ ﴿23﴾ فَيُعَذِّبُهُ اللَّهُ الْعَذَابَ الْأَكْبَرَ ﴿24﴾ إِنَّ إِلَيْنَا إِيَابَهُمْ ﴿25﴾ ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم ﴿26﴾﴾\n\nمعاني المفردات: الإبل: هي الجمال · سطحت: بسطت ومهدت · بمصيطر: بمتسلط · إن إلينا إيابهم: أي رجوعهم بعد الموت · ثم إن علينا حسابهم: أي محاسبتهم.\n\nما ترشد إليه الآيات:\n1) التأمل في مخلوقات الله العظيمة من حولنا، وعجائب صنعه فيها، مثل الإبل بصفاتها الفريدة، والسماء بارتفاعها واتساعها، والجبال بثباتها، والأرض بامتدادها وتيسيرها للعيش؛ لأن هذا التأمل يقود الإنسان العاقل إلى الإيمان بعظمة الله تعالى وقدرته المطلقة.\n2) التأكيد على دور النبي ﷺ في التذكير والدعوة إلى الحق، وليس فرض الإيمان على الناس؛ إذ إن الهدى بيد الله تعالى.\n3) التحذير من الكفر وعاقبته السيئة؛ حيث يعذب صاحبه بالعذاب الأكبر في الآخرة.\n4) كل إنسان سيعود في النهاية إلى الله تعالى؛ حيث سيحاسب على أعماله، فينال المؤمن جزاءه الحسن، ويواجه الكافر عذابه المستحق.',
    example:{q:'ما معنى «سُطحت» في قوله: وإلى الأرض كيف سطحت؟', steps:['أرجع إلى معاني المفردات','سطحت: بسطت ومهدت','أي جعلها الله ممهدة صالحة للعيش'], a:'بُسطت ومُهّدت'},
    questions:[

  { id:'o3-is-jumua', subject:'تربية إسلامية', unit:'الوحدة الأولى: الثقة بالله', title:'العبادات: صلاة الجمعة', page:16, lang:'ar', source:'book',
    objectives:['أستنتج أهمية صلاة الجمعة','أحدد شروط وآداب صلاة الجمعة','أستنتج قيمة التعاون والاجتماع مع المسلمين في المسجد'],
    concepts:['صلاة الجمعة صلاة خاصة تؤدى بدلًا من صلاة الظهر يوم الجمعة','الخطبة قبل الصلاة','آدابها: الاغتسال والتطيب، الملابس النظيفة، الذهاب مبكرًا، الاستماع للخطبة بإنصات'],
    explain:'من الكتاب (ص16): المسلم عضو فاعل في المجتمع؛ يهتم بقضاياه، ويشارك في شئونه، ويحمل همومه، ويساهم في بنائه ورقيه.\nومن أجل تعزيز هذا الترابط شرع الله للمسلمين اجتماعًا أسبوعيًا يوم الجمعة؛ حيث يتلاقى المؤمنون في بيوت الله، فيصلون صلاة خاصة هي (صلاة الجمعة) بدلًا من صلاة الظهر.\nوقد جاء الأمر الإلهي بصلاة الجمعة في القرآن الكريم، قال تعالى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا نُودِيَ لِلصَّلَاةِ مِن يَوْمِ الْجُمُعَةِ فَاسْعَوْا إِلَىٰ ذِكْرِ اللَّهِ وَذَرُوا الْبَيْعَ ۚ ذَٰلِكُمْ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ﴾ (الجمعة: 9).\nفمع ارتفاع أذان صلاة الجمعة يترك المسلمون كل ما في أيديهم، ويتوافدون إلى بيوت الله، ملبين نداء الإيمان؛ يستمعون إلى الإمام الذي يخطب فيهم ليذكرهم بأمور دينهم.\nوقد وضع الإسلام آدابًا لصلاة الجمعة، تبدأ بالاغتسال والتطيب وارتداء الملابس النظيفة؛ ليلقى المسلم المصلين في أنقى صورة وأجمل رائحة.\nكما يستحب الذهاب مبكرًا، استعدادًا للاستماع إلى الخطبة بإنصات، والاستفادة من معانيها العميقة التي تهذب النفس، وتقوي الإيمان.',
    example:{q:'متى نصلي صلاة الجمعة؟', steps:['صلاة الجمعة تؤدى بدلًا من صلاة الظهر','إذن في وقت الظهر يوم الجمعة'], a:'وقت الظهر'},

  { id:'o3-is-huzn', subject:'تربية إسلامية', unit:'الوحدة الأولى: الثقة بالله', title:'السير والشخصيات: عام الحزن', page:19, lang:'ar', source:'book',
    objectives:['أسرد أهم أحداث عام الحزن في حياة النبي ﷺ','أوضح أثر فقد السيدة خديجة وأبي طالب على النبي ﷺ','أستنتج القيم الواردة في الدرس'],
    concepts:['عام الحزن: العام العاشر من البعثة','توفي فيه عم النبي أبو طالب ثم زوجته السيدة خديجة رضي الله عنها','النبي ﷺ لم ييأس بل استمد القوة من الله وظل يدعو إلى الإسلام'],
    explain:'من الكتاب (ص19): منذ اللحظة التي أمر الله تعالى فيها نبيه ﷺ بالجهر بالدعوة اشتد إيذاء المشركين له ولأصحابه رضي الله عنهم.\nوكانت زوجته السيدة خديجة رضي الله عنها تخفف عنه، وتواسيه بحبها وعطفها، وكان عمه أبو طالب يحميه من أذى الكفار.\nوفي العام العاشر من البعثة شاءت إرادة الله أن يرحل هذان الركنان العظيمان عن حياته؛ فقد توفي عمه أبو طالب، ثم توفيت السيدة خديجة رضي الله عنها.\nفتضاعف الحزن في قلب النبي ﷺ؛ حيث فقد الأحبة، وفقد الدعم والسند.\nكان ذلك العام حقًا (عام الحزن)، حين اشتدت المصاعب على رسول الله ﷺ، واشتدت الهموم على قلبه.\nلكن إيمان النبي ﷺ كان أعظم من أن يهتز، وإرادته أقوى من أن تنكسر؛ فلم ييأس رسول الله ﷺ، بل استمد القوة من الله، وظل يدعو إلى الإسلام رغم الإيذاء والألم.',
    example:{q:'لماذا سُمي هذا العام «عام الحزن»؟', steps:['فيه توفي أبو طالب وتوفيت السيدة خديجة','فقد النبي ﷺ الأحبة والدعم والسند','فاشتد الحزن على قلبه'], a:'بسبب وفاة عمه أبي طالب وزوجته خديجة في عام واحد'},
    questions:[
      {id:'q1',type:'choice',skill:'أحداث عام الحزن',level:'تذكر',difficulty:1,prompt:'أُطلق على العام العاشر من البعثة:',options:['عام الفيل','عام الحزن','عام الهجرة'],answer:1,hints:['نشاط 4 في الكتاب ص21'],explain:'عام الحزن.'},

    explain:'من الكتاب (ص22): كان نبي الله زكريا عليه السلام رجلًا صالحًا حكيمًا، ذا مكانة عظيمة بين قومه، يلجئون إليه في أمور دينهم، ويستنيرون بحكمته.\nورغم كبر سنه وعقم زوجته بقيت في قلبه رغبة صادقة لم تتحقق بعد، وهي أن يرزقه الله ولدًا صالحًا.\nفي تلك الأيام كانت أخت زوجته حاملًا، وقد نذرت أن تهب ما في بطنها لله؛ فقد كان الناس في ذلك الزمان يقدمون بعض أبنائهم الذكور للعبادة ولخدمة بيت الله.\nولكن الله رزقها أنثى سمتها (مريم)، وكان لنبي الله زكريا عليه السلام شرف رعايتها وتربيتها.\nوقد خصص زكريا عليه السلام لمريم مكانًا لتعبد الله فيه، وكان يحرص على زيارتها، والاعتناء بها.\nكبرت مريم في طهرها وعبادتها، وكان زكريا عليه السلام كلما دخل عليها وجد عندها طعامًا لم يأتها به، وحين يسألها عنه تجيبه بثقة وإيمان: ﴿هُوَ مِنْ عِندِ اللَّهِ﴾ (آل عمران: 37).\nفي تلك اللحظة، تجدد الأمل في قلب زكريا عليه السلام، فرفع يديه بالدعاء، مستغيثًا بربه أن يرزقه ولدًا صالحًا؛ فجاءته البشرى من السماء، واستجاب الله دعاءه، ووهبه ولدًا اسمه (يحيى)؛ ليكون نبيًا صالحًا، وآية على قدرة الله العظيمة، ورحمته الواسعة؛ فهو يرزق من يشاء بغير حساب.',

    explain:'من الكتاب (ص25): يثق الطفل بأبيه، فيلجأ إلى حضنه؛ ليشعر بالأمان؛ إذ يجد في قوة والده ملاذًا يغطي ضعفه، فينام هادئًا مطمئنًا.\nفكيف يكون حال الإنسان عندما يثق برب الكون، ويلجأ إلى الله تعالى الذي لا حدود لقدرته؟!\nعندما يثق المؤمن بربه ويحسن الظن به، فإنه يضع همومه وأثقاله بين يدي من لا يعجزه شيء، ويستعين بمن بيده مقاليد السماوات والأرض، والمتصرف في شئون الخلق.\nالثقة بالله تعالى تعطي المؤمن شعورًا فريدًا بالاطمئنان والأمان، فيختفي منه الخوف، ويتباعد عنه الضيق؛ فيجد في كل محنة فرجًا، وفي كل شدة أملًا.\nكما تمده الثقة بالله تعالى بقوة لا حدود لها، فيصمد أمام الصعاب صمود الجبال، ويصبر على المصائب كما صبر الأنبياء عليهم السلام، فلا يصيبه فزع ولا يغلبه يأس، ويتحول ضعفه إلى قوة.',

(function(){

  const b=window.RIHLA_BOOKS.omar, id='omar'; if(!b) return; let changed=false;
  const bl=b.lessons.map(l=>Object.assign({term:b.term,attachments:[],createdAt:Date.now()},l));
  const D=R.DEMO_LESSONS[id];
  if(D){ const keep=D.filter(l=>!bl.some(x=>x.id===l.id)); D.length=0; D.push(...bl,...keep); } else R.DEMO_LESSONS[id]=bl;
  if(b.map&&b.map.length&&R.CURRICULUM){

    const others=(cur.subjects||[]).filter(s=>!b.map.some(m=>m.name===s.name));

    cur.year='2026/2027 — '+b.term;
    cur.note='خريطة اللغة العربية والتربية الإسلامية منقولة من فهارس كتب الوزارة التي رفعها ولي الأمر (الفصل الدراسي الأول). الرياضيات وEnglish ما زالتا من مصادر منشورة حتى يُرفع كتاباهما. الدروس الموسومة «من الكتاب» مبنية على نص الكتاب وصفحاته.';
  }

  bl.forEach(dl=>{ const ex=ch.lessons.find(l=>l.id===dl.id);
    if(!ex){ ch.lessons.push(Object.assign({},dl)); changed=true; }
    else if(ex.source==='book'&&(JSON.stringify(ex.questions)!==JSON.stringify(dl.questions)||ex.explain!==dl.explain)){ Object.assign(ex,{unit:dl.unit,title:dl.title,subject:dl.subject,questions:dl.questions,explain:dl.explain,example:dl.example,objectives:dl.objectives,concepts:dl.concepts,page:dl.page,term:dl.term}); changed=true; }
  });
