    explain:'من الكتاب (ص14) — نلاحظ: الجدول التالي يوضح عدد نقاط حسن في اللعبة:\nالنقاط: 3 | 2 | 1 | 0 ← المجموع\nعدد الرميات: 0 | 1 | 3 | 6 ← 10\n(1) ما إجمالي عدد النقاط للرميات التي أصابت منطقة النقطة الواحدة؟ (2) ما إجمالي عدد النقاط للرميات التي أصابت منطقة الصفر نقطة؟ (3) ما إجمالي عدد نقاط حسن؟\n\nطريقة الحل: نحسب إجمالي عدد النقاط بالعملية الحسابية: (النقاط) × (عدد الرميات).\n(1) 1 × 3 = 3 ← الإجابة: 3 نقاط.\n(2) 0 × 6 = 0 ← الإجابة: 0 نقطة.\n(3) أوجد إجمالي النقاط لباقي المناطق ثم احسب المجموع: منطقة الـ 3 نقاط: 3 × 0 = 0. منطقة الـ 2 نقطة: 2 × 1 = 2. العملية الحسابية: 0 + 2 + 3 + 0 = 5 ← الإجابة: 5 نقاط.\n\nوقت المحاولة (ص15) — درجات سارة: النقاط 10، 5، 3، 0 ؛ عدد الرميات 3، 1، 4، 2 (المجموع 10).\nهيا نتدرب — درجات دينا: النقاط 3، 2، 1، 0 ؛ الرميات 3، 0، 5، 2. درجات جمال: النقاط 10، 5، 3، 0 ؛ الرميات 2، 0، 7، 1.',

  { id:'o3-m-1-5', subject:'رياضيات', unit:'الفصل 1: قواعد الضرب', title:'1-5 إيجاد العدد المجهول', page:16, lang:'ar', source:'book',
    objectives:['أجد العدد المجهول في عملية ضرب بالتفكير في جدول الضرب','أستخدم تبديل الترتيب عندما يكون المجهول هو المضروب'],
    concepts:['إذا لم تعرف المضروب فيه، فكّر في جدول ضرب العدد الأول: 4 × □ = 24 ← فكّر في جدول ضرب العدد 4 ← 6','إذا لم تعرف المضروب، يمكنك استخدام قواعد الضرب: □ × 4 = 24 ← بدّل ترتيب الأعداد ← 4 × □ = 24 ← 6'],
    explain:'من الكتاب (ص16) — نلاحظ:\n• إذا لم تعرف المضروب فيه، فكّر في جدول ضرب العدد الأول. مثال: 4 × □ = 24 ← فكّر في جدول ضرب العدد 4 ← □ = 6.\n• إذا لم تعرف المضروب، يمكنك استخدام قواعد الضرب. مثال: □ × 4 = 24 ← بدّل ترتيب الأعداد ← 4 × □ = 24 ← فكّر في جدول ضرب العدد 4 ← □ = 6.\n(فقط فكّر في جدول الضرب الذي تعرفه!)\n\nاستعدوا يا أصدقائي — طريقة الحل:\n(1) 8 × □ = 40: ابحث عن ناتج ضرب يساوي 40 في جدول ضرب العدد 8: 8×1=8، 8×2=16، 8×3=24، 8×4=32، 8×5=40 ← إذًا 8 × 5 = 40.\n(2) □ × 4 = 16: بدّل ترتيب الأعداد في عملية الضرب ← 4 × □ = 16: 4×1=4، 4×2=8، 4×3=12، 4×4=16 ← إذًا 4 × 4 = 16.\n\nوقت المحاولة (ص17): 3 × □ = 12، □ × 6 = 36، □ × 9 = 45، □ × 7 = 42، □ × 10 = 50، 2 × □ = 0.\nهيا نتدرب: 2 × □ = 14، □ × 3 = 27، 5 × □ = 25، 9 × □ = 36، 4 × □ = 32، □ × 6 = 24، 7 × □ = 35، □ × 8 = 48، 10 × □ = 70، □ × 10 = 40، 3 × □ = 0، □ × 9 = 0.',
    example:{q:'□ × 9 = 45', steps:['بدّل الترتيب: 9 × □ = 45','جدول 9: 9×5 = 45','□ = 5'], a:'5'},
    questions:[
      {id:'q1',type:'short',skill:'إيجاد المضروب فيه المجهول',level:'تطبيق',difficulty:1,prompt:'3 × □ = 12 ← □ = ___',accept:['4','٤'],hints:['جدول ضرب 3'],explain:'3 × 4 = 12.'},
      {id:'q2',type:'short',skill:'إيجاد المضروب المجهول',level:'تطبيق',difficulty:1,prompt:'□ × 6 = 36 ← □ = ___',accept:['6','٦'],hints:['بدّل الترتيب وفكّر في جدول 6'],explain:'6 × 6 = 36.'},
      {id:'q3',type:'short',skill:'إيجاد المضروب فيه المجهول',level:'تطبيق',difficulty:2,prompt:'8 × □ = 40 ← □ = ___',accept:['5','٥'],hints:['8×5 = ؟'],explain:'8 × 5 = 40 (الكتاب ص16).'},
      {id:'q4',type:'short',skill:'إيجاد المضروب المجهول',level:'تطبيق',difficulty:2,prompt:'□ × 7 = 42 ← □ = ___',accept:['6','٦'],hints:['7 × 6'],explain:'6 × 7 = 42.'},
      {id:'q5',type:'choice',skill:'الضرب في 0',level:'فهم',difficulty:2,prompt:'2 × □ = 0 ← □ =',options:['0','2','1'],answer:0,hints:['أي عدد × 0 = 0'],explain:'2 × 0 = 0.'},
      {id:'q6',type:'match',skill:'إيجاد العدد المجهول',level:'تطبيق',difficulty:2,prompt:'صِل كل عملية بالعدد المجهول',pairs:[['9 × □ = 36','4'],['□ × 8 = 48','6'],['10 × □ = 70','7'],['5 × □ = 25','5']],hints:['هيا نتدرب ص17'],explain:'9×4=36، 6×8=48، 10×7=70، 5×5=25.'},
      {id:'q7',type:'short',skill:'إيجاد المضروب المجهول',level:'استنتاج',difficulty:3,prompt:'□ × 10 = 40 ← □ = ___',accept:['4','٤'],hints:['10 × 4'],explain:'4 × 10 = 40.'}
    ]},

  { id:'o3-en-u1-l1', subject:'English', unit:"Unit 1: Let's Learn Together!", title:'Lesson 1: Greetings and Introductions', page:6, lang:'en', source:'book',
    objectives:['Use common greetings in everyday conversations','Introduce yourself: name, age, class','Respond to greetings correctly'],
    concepts:['Greetings: Hello! Good morning! How are you? I am fine, thank you. Nice to meet you. See you later! Goodbye!','Introducing yourself: My name is… / I am… / I am from Egypt. / I am … years old. / I am in Primary 3.'],
    explain:'From the book (p.6–9):\nGreetings: Hello! · Good morning! · How are you? · I am fine, thank you. · Nice to meet you. · See you later! · Goodbye!\nIntroducing Yourself: My name is… · I am… · I am from Egypt. · I am …. years old. · I am in Primary 3.\n\nMeeting a New Friend:\nSara: Hello!\nLina: Good morning!\nSara: How are you?\nLina: I am fine, thank you. How are you?\nSara: I\'m fine too, thank you. What\'s your name?\nLina: My name is Lina. What\'s your name?\nSara: My name is Sara.\nLina: How old are you?\nSara: I am 8 years old! I am in Primary 3.\nLina: Nice to meet you, Sara!\nSara: Nice to meet you too, Lina!\nLina: See you later!\nSara: Goodbye!\n\nWhen do we say it? Good morning! → when you meet in the morning. How are you? → when you check on someone. Nice to meet you. → when you meet someone new. See you later! → when you say goodbye.\n\nبالعربية: Hello أهلًا، Good morning صباح الخير، How are you? كيف حالك؟، I am fine أنا بخير، Nice to meet you سعيد بلقائك، See you later أراك لاحقًا، Goodbye مع السلامة.',
    example:{q:'Complete: Good ____, my name is Adam.', steps:['A greeting in the morning','Good morning'], a:'morning'},
    questions:[
      {id:'q1',type:'match',skill:'Greetings: when to use',level:'فهم',difficulty:1,prompt:'Match each phrase with when you say it',pairs:[['Good morning!','When you meet in the morning'],['How are you?','When you check on someone'],['Nice to meet you.','When you meet someone new'],['See you later!','When you say goodbye']],hints:['Exercise 3, p.6'],explain:'Good morning → D, How are you → A, Nice to meet you → B, See you later → C.'},
      {id:'q2',type:'choice',skill:'Responding to greetings',level:'تطبيق',difficulty:1,prompt:'"Hello, Sami. How are you?" — "______"',options:["I'm fine, thank you.",'See you later!','How are you?'],answer:0,hints:['Exercise 8, p.9'],explain:"I'm fine, thank you."},
      {id:'q3',type:'choice',skill:'Responding to greetings',level:'تطبيق',difficulty:1,prompt:'"Nice to meet you, Nada!" — "______"',options:['Nice to meet you, too.','Good night!',"I'm fine, thank you."],answer:0,hints:['Say it back'],explain:'Nice to meet you, too.'},
      {id:'q4',type:'choice',skill:'Responding to greetings',level:'تطبيق',difficulty:2,prompt:'"See you later!" — "______"',options:['Goodbye!','Good morning!',"I'm fine, thank you."],answer:0,hints:['Saying goodbye'],explain:'Goodbye!'},
      {id:'q5',type:'short',skill:'Introducing yourself',level:'تطبيق',difficulty:2,prompt:'Complete: I am 8 ______ old.',accept:['years','year'],hints:['How old are you?'],explain:'I am 8 years old.'},
      {id:'q6',type:'order',skill:'Introducing yourself',level:'تطبيق',difficulty:2,prompt:'Put the words in order',items:['is','Lina.','My name'],answer:[2,0,1],hints:['My name …'],explain:'My name is Lina.'},
